name: Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3 generate --android
          npx cap sync android

      - name: Use a stable signing key (so new versions install over old ones)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Sahar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sahar-apk
          path: Sahar.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sahar — последняя сборка
          body: |
            Скачайте **Sahar.apk** ниже и установите на Android-телефон.
            Сборка из коммита ${{ github.sha }}.
          prerelease: false
          make_latest: true
          files: Sahar.apk
