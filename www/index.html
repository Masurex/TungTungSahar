<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121014">
  <meta name="description" content="Sahar — бесплатный стриминг музыки и радио без загрузки на телефон">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sahar">
  <title>Sahar Музыка</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn back-btn" id="backBtn" aria-label="Назад" hidden></button>
      <h1 id="pageTitle">Sahar</h1>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <div class="mini" id="mini" hidden>
      <div class="mini-progress"><div id="miniProgress"></div></div>
      <button class="mini-open" id="miniOpen" aria-label="Открыть плеер">
        <img id="miniArt" alt="">
        <span class="mini-text">
          <span class="mini-title" id="miniTitle"></span>
          <span class="mini-artist" id="miniArtist"></span>
        </span>
      </button>
      <button class="icon-btn" id="miniLike" aria-label="Нравится"></button>
      <button class="icon-btn" id="miniPlay" aria-label="Играть"></button>
    </div>

    <nav class="tabs" id="tabs">
      <a href="#/home" data-tab="home"><span class="ti" data-icon="home"></span><span>Главная</span></a>
      <a href="#/search" data-tab="search"><span class="ti" data-icon="search"></span><span>Поиск</span></a>
      <a href="#/radio" data-tab="radio"><span class="ti" data-icon="radio"></span><span>Радио</span></a>
      <a href="#/library" data-tab="library"><span class="ti" data-icon="library"></span><span>Медиатека</span></a>
    </nav>
  </div>

  <section class="player" id="player" aria-hidden="true">
    <div class="player-bg" id="playerBg"></div>
    <div class="player-inner">
      <div class="player-head">
        <button class="icon-btn" id="playerClose" aria-label="Свернуть"></button>
        <span class="player-src" id="playerSrc">Сейчас играет</span>
        <button class="icon-btn" id="queueBtn" aria-label="Очередь"></button>
      </div>
      <div class="player-art-wrap"><img class="player-art" id="playerArt" alt=""></div>
      <div class="player-meta">
        <div class="player-meta-text">
          <div class="player-title" id="playerTitle"></div>
          <button class="player-artist" id="playerArtist"></button>
        </div>
        <button class="icon-btn" id="playerLike" aria-label="Нравится"></button>
      </div>
      <div class="seek" id="seekWrap">
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="live-badge" id="liveBadge" hidden>● В ЭФИРЕ</div>
      <div class="controls">
        <button class="icon-btn" id="shuffleBtn" aria-label="Перемешать"></button>
        <button class="icon-btn big" id="prevBtn" aria-label="Предыдущий"></button>
        <button class="play-btn" id="playBtn" aria-label="Играть"></button>
        <button class="icon-btn big" id="nextBtn" aria-label="Следующий"></button>
        <button class="icon-btn" id="repeatBtn" aria-label="Повтор"></button>
      </div>
    </div>
    <div class="queue" id="queue" hidden>
      <div class="queue-head">
        <strong>Очередь</strong>
        <button class="icon-btn" id="queueClose" aria-label="Закрыть очередь"></button>
      </div>
      <div class="queue-list" id="queueList"></div>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
